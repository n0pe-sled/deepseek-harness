name: Release macOS app

# Builds the self-contained .dmg: the Electron shell plus the harness closure
# staged from this repository's own tree (see apps/desktop/scripts/stage-harness.mjs).
# The app lives at apps/desktop inside the harness repository, so the single
# checkout below supplies both halves: the harness source at the root and the app in
# its subdirectory. The harness version staged is whatever this repository is on at
# the revision the run checked out — the workflow never installs a published
# @deepseek-ai/dsh from the registry, because the shipped harness must be the same
# bytes the developer runs locally.
#
# Tracks the harness revision in the build summary so a release always says
# which harness it carries.
#
# Note: the `secrets` context is NOT available in a step-level `if`. Referencing
# it there does not fail the step — it invalidates the whole workflow file, and
# the run dies in under a second having created no jobs at all. Secrets may only
# be used in `env`, `with`, and `run`; branch on them inside the shell instead.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: 'macOS architecture to build'
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: write

jobs:
  build:
    # macOS is required twice over: the shipped closure carries darwin-specific
    # native addons (node-pty's spawn-helper, sharp, koffi), and the .dmg can
    # only be produced on macOS.
    runs-on: macos-14
    # Two waits on the notary service now, not one: the signed .app is submitted
    # and stapled, then the .dmg that carries it is submitted and stapled. The
    # v0.1.2 run spent about 70 minutes with one of the two, most of it in the
    # dmg step, so the one-notarization budget of 90 minutes would risk killing
    # the job mid-publish.
    timeout-minutes: 180

    steps:
      # One checkout, at the repository root: the harness workspace and the app
      # under apps/desktop come from the same revision, so the closure staged
      # below is always the harness this run carries.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # The harness lockfile is the root one; apps/desktop keeps its own.
          cache-dependency-path: pnpm-lock.yaml

      # The harness workspace is large; install and build it before the app so a
      # failure here is unambiguous.
      - name: Install harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match the desktop package version')
          }
          NODE

      - name: Build the harness
        run: pnpm run build

      # apps/desktop is deliberately outside the root pnpm workspace (it owns a
      # lockfile and an electron tree), so it installs against its own
      # pnpm-workspace.yaml from its own directory.
      - name: Install app dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Unit tests
        working-directory: apps/desktop
        run: pnpm test

      # stage-harness resolves the workspace two levels up from apps/desktop.
      # DSH_HARNESS_WORKSPACE names it outright so a red staging run cannot
      # be mistaken for a resolution problem.
      - name: Stage the harness into the app
        working-directory: apps/desktop
        env:
          DSH_HARNESS_WORKSPACE: ${{ github.workspace }}
        run: pnpm stage:harness:all

      - name: Build the Electron app
        working-directory: apps/desktop
        run: pnpm build

      # Proves the packaged closure actually boots before a .dmg is published:
      # the smoke run spawns the bundled harness, loads the UI over the dsh-app
      # protocol and asserts the settings surface answers.
      - name: Smoke-test the bundled harness
        working-directory: apps/desktop
        env:
          DSH_SMOKE: '1'
          # The smoke run boots the real app, and its launch update check would
          # then reach GitHub from a runner that holds no token for this private
          # repository. This gate is about the bundled closure booting.
          DSH_UPDATE_AUTOSTART: '0'
          DSH_HOME: ${{ runner.temp }}/dsh-smoke-home
          DSH_USER_DATA: ${{ runner.temp }}/dsh-smoke-userdata
        run: |
          mkdir -p "$DSH_HOME"
          pnpm start
          echo "smoke test passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the .dmg
        working-directory: apps/desktop
        env:
          # When these secrets exist electron-builder signs with a Developer ID
          # and notarizes; otherwise it produces an unsigned build that runs
          # after the documented quarantine removal in README.md.
          #
          # The secret is not just passed through: its PRESENCE is turned into a
          # flag, because by the time the shell runs there is no way to tell a
          # certificate from the directory the runner already points CSC_LINK at.
          DSH_SIGNING_ENABLED: ${{ secrets.MAC_CERTIFICATE != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An ABSENT CSC_LINK is not the same as an empty one: electron-builder
          # reads any non-empty CSC_LINK as a path to a signing certificate,
          # resolves it, and calls `stat.isFile()` — so a CSC_LINK holding a
          # directory aborts the build with "<dir> not a file".
          #
          # GitHub already sets CSC_LINK in the ambient environment to the
          # directory the repository is checked out into, which is exactly such a
          # directory, so the no-certificate path has to remove the variable
          # from the environment rather than blank it. Testing whether CSC_LINK
          # is non-empty cannot decide this: both the shadowed directory and a
          # real certificate are non-empty. Only the secret's presence can, and
          # `secrets` cannot be read in a step-level `if`, so the env block above
          # records it as a flag for this branch.
          if [ "${DSH_SIGNING_ENABLED:-}" = "1" ] && [ -n "${CSC_LINK:-}" ]; then
            echo "using the provided signing certificate"
          else
            echo "no signing certificate; dropping CSC_LINK/CSC_KEY_PASSWORD for an unsigned build"
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          # --publish never: electron-builder auto-enables publishing on a v* tag,
          # and the release is published by softprops/action-gh-release below.
          pnpm exec electron-builder --mac dmg --publish never --${{ inputs.arch || 'arm64' }}

      # electron-builder notarizes the .app and the pkg target, but not the dmg
      # that carries the .app, so the disk image itself ships with no ticket. It
      # gets quarantined on download like the app does, and an unnotarized image
      # warns on the first double-click even when the app inside is notarized.
      # Notarize and staple the image, so opening it is as quiet as opening the
      # app: the user mounts it, drags the app out, and runs it.
      - name: Notarize and staple the .dmg
        working-directory: apps/desktop
        env:
          # The certificate's PRESENCE is the flag, exactly as in the build step:
          # `secrets` cannot be read in a step-level `if`, so the branch is in
          # the shell. With no certificate the app is unsigned, and notarizing an
          # unsigned app can only fail.
          DSH_SIGNING_ENABLED: ${{ secrets.MAC_CERTIFICATE != '' && '1' || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${DSH_SIGNING_ENABLED:-}" != "1" ]; then
            echo "no signing certificate; leaving the dmg unnotarized"
            exit 0
          fi
          for dmg in release/*.dmg; do
            # --wait holds the step until Apple answers, and exits nonzero when
            # the submission is rejected, printing the reasons, so a bad image
            # fails here rather than reaching the release.
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$dmg"
            # Prove the ticket landed: stapling can succeed while the image
            # still carries no usable ticket.
            xcrun stapler validate "$dmg"
          done

      - name: Summarize the release
        run: |
          # Read versions with a file argument. `require()` resolves a bare
          # path as a PACKAGE and fails with "Cannot find module"; relative
          # paths have to be spelled `./…`.
          HARNESS_VERSION=$(node -p "require(process.argv[1]).version" "./apps/cli/package.json")
          APP_VERSION=$(node -p "require(process.argv[1]).version" "./apps/desktop/package.json")
          HARNESS_REV=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          DMG=$(basename ./apps/desktop/release/*.dmg)
          ls -lh ./apps/desktop/release/*.dmg >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| app version | ${APP_VERSION} |"
            echo "| bundled harness | ${HARNESS_VERSION} |"
            echo "| harness revision | ${HARNESS_REV} |"
            echo "| architecture | ${{ inputs.arch || 'arm64' }} |"
            echo "| artifact | ${DMG} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The app's update check compares a downloaded image against the SHA-256 the
      # release publishes for it, and reports the image as unconfirmed when the
      # release publishes none. `shasum -a 256` prints exactly the
      # "<hex>  <name>" line that check reads, so the digest is taken here
      # rather than left for someone to paste into a release by hand.
      - name: Write the release body
        working-directory: apps/desktop
        run: |
          # The digest has to name the file exactly as the asset is published,
          # or the check cannot match it: a `./` prefix from the glob would
          # leave every image unconfirmed even though the release publishes its
          # digest. A missing image fails here rather than shipping a body with a
          # literal glob in it.
          for dmg in release/*.dmg; do
            if [ ! -f "$dmg" ]; then
              echo "no .dmg in release/ to digest" >&2
              exit 1
            fi
          done
          {
            echo "macOS build of DSH Desktop, bundling DeepSeek Harness."
            echo ""
            echo "The .dmg is self-contained: it carries the harness closure and runs"
            echo "it with the app's own Electron runtime, so no Node install and no"
            echo "\`dsh\` on PATH are required."
            echo ""
            echo "Download the \`.dmg\`, drag **DSH Desktop** into \`/Applications\`, and"
            echo "launch it. If macOS blocks the first launch, see the quarantine note"
            echo "in the README."
            echo ""
            echo "## Artifact digest"
            echo ""
            echo "The app compares a downloaded image against the SHA-256 below and"
            echo "reports the image as unconfirmed when the release publishes none."
            echo ""
            echo '```'
            ( cd release && shasum -a 256 -- *.dmg )
            echo '```'
          } > release/release-body.md
          cat release/release-body.md

      - name: Upload the .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-dmg-${{ inputs.arch || 'arm64' }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.dmg
          generate_release_notes: true
          body_path: apps/desktop/release/release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
