# Build and publish the dsh sandbox image.
#
# Checks out the harness fork and the app repo at PINNED refs so the image is
# reproducible; bump the pins deliberately (a new pin is a new image tag, and
# the desktop app selects images by tag).
#
# Requires the container-sandbox work only after the pins move: the pins are
# the interface between this repo and your in-flight plugin work.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # Pinned sources the image is built from. Full commit SHAs, deliberately:
  # the harness ref decides which closure and plugins are baked, and the app
  # ref pins the staging script that produces them. Bump both by hand — a
  # moving ref here would make two image tags from the same version differ.
  HARNESS_REPO: n0pe-sled/deepseek-harness
  HARNESS_REF: c870675c14e60c9147162ba0507814eecb03921d
  APP_REPO: n0pe-sled/DeepSeek-App
  APP_REF: 70627b4b2ec610905975a440d6713b9d87a58eb9
  IMAGE: ghcr.io/n0pe-sled/dsh-sandbox

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped here because `secrets` cannot be read directly in a step `if`.
      REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The harness repo and its plugin submodules are private, and
      # GITHUB_TOKEN is scoped to THIS repo, so reading them needs a PAT. Say
      # that plainly instead of failing later with an opaque "repository not
      # found". The app repo is public and needs no token.
      - name: Require a PAT for the private harness checkout
        if: env.REPOS_TOKEN == ''
        run: |
          echo "::error::REPOS_TOKEN is not set. ${HARNESS_REPO} and its plugin submodules are private and GITHUB_TOKEN cannot read them. Add a fine-grained PAT with read-only Contents access to that repo AND every plugin submodule repo as the REPOS_TOKEN secret in this repository."
          exit 1

      # Full history, because staging a foreign target deploys from a scratch
      # `git worktree` of the harness checkout. Submodules carry the plugins:
      # without them `harness/plugins/*` arrives as empty directories and the
      # image quietly ships with no fork plugins at all.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.HARNESS_REF }}
          path: harness
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.REPOS_TOKEN || github.token }}
      # Public, so the default GITHUB_TOKEN reads it; submodules are on by
      # default here too, and this repo has none.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm || npm install -g pnpm

      - name: Prepare build context
        run: node scripts/prepare-context.mjs --harness harness --app app --out build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version=$(node -p "require('./build/meta.json').version")
          revision=$(node -p "require('./build/meta.json').revision")
          echo "tags=${IMAGE}:latest,${IMAGE}:v${version},${IMAGE}:${version}-${revision},${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The recipe is a Containerfile; build-push-action defaults to Dockerfile.
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dsh-sandbox
            org.opencontainers.image.description=Containerized DeepSeek Harness with the fork's plugins pre-installed
            org.opencontainers.image.version=${{ github.ref_name }}
