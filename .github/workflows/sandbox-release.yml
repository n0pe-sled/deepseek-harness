# Build and publish the dsh sandbox image.
#
# One checkout, at the repository root: the harness workspace, the app under
# apps/desktop and the sandbox under deploy/sandbox-image are the same
# revision, so the closure baked into an image is always the one this run read.
# The two cross-repository pins this workflow used to carry are gone with the
# merge, and a pin that named a commit of this repository could not: it would
# build the sandbox tree of one revision with the harness tree of another, and
# the file that ran would not be the file that ran. Rebuild a past revision with
# a workflow_dispatch and `ref` set to its full commit SHA.
name: Release sandbox image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or ref to build the image from; empty builds the ref this run fired on'
        required: false
        default: ''
        type: string

env:
  IMAGE: ghcr.io/n0pe-sled/dsh-sandbox
  # The image build context, relative to the checkout root. The Containerfile
  # reads build/ below this directory, so it is also the buildx context.
  CONTEXT: deploy/sandbox-image

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every repository this build reads is public: this one, and the 13 plugin
      # submodules it carries. The default GITHUB_TOKEN therefore reads them and
      # no PAT is needed. If one ever goes private, add a fine-grained PAT with
      # read-only Contents access to it as a REPOS_TOKEN secret and pass
      # `token: ${{ secrets.REPOS_TOKEN }}` on the checkout below.
      #
      # Full history, because staging a foreign target deploys from a scratch
      # `git worktree` of the harness checkout. Submodules carry the plugins:
      # without them plugins/* arrives as empty directories, and the image quietly
      # ships with no fork plugins at all.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm || npm install -g pnpm

      # Both paths are inside the checkout the step above produced. The app moved
      # in at apps/desktop, so the staging script the context prep delegates to
      # is apps/desktop/scripts/stage-harness.mjs.
      - name: Prepare build context
        run: node "$CONTEXT/scripts/prepare-context.mjs" --harness . --app apps/desktop --out "$CONTEXT/build"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version=$(node -p "require('./$CONTEXT/build/meta.json').version")
          revision=$(node -p "require('./$CONTEXT/build/meta.json').revision")
          echo "tags=${IMAGE}:latest,${IMAGE}:v${version},${IMAGE}:${version}-${revision},${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          # The recipe is a Containerfile; build-push-action defaults to Dockerfile.
          file: ${{ env.CONTEXT }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dsh-sandbox
            org.opencontainers.image.description=Containerized DeepSeek Harness with the fork's plugins pre-installed
            org.opencontainers.image.version=${{ github.ref_name }}
