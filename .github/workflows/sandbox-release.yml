name: Release sandbox image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or ref to build the image from; empty builds the ref this run fired on'
        required: false
        default: ''
        type: string

env:
  IMAGE: ghcr.io/n0pe-sled/dsh-sandbox
  # The image build context, relative to the checkout root. The Containerfile
  # reads build/ below this directory, so it is also the buildx context.
  CONTEXT: deploy/sandbox-image

concurrency:
  group: sandbox-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every repository this build reads is public: this one, and the 13 plugin
      # submodules it carries. The default GITHUB_TOKEN therefore reads them and
      # no PAT is needed. If one ever goes private, add a fine-grained PAT with
      # read-only Contents access to it as a REPOS_TOKEN secret and pass
      # `token: ${{ secrets.REPOS_TOKEN }}` on the checkout below.
      #
      # Full history, because staging a foreign target deploys from a scratch
      # `git worktree` of the harness checkout. Submodules carry the plugins:
      # without them plugins/* arrives as empty directories, and the image quietly
      # ships with no fork plugins at all.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm || npm install -g pnpm

      # Both paths are inside the checkout the step above produced. The app moved
      # in at apps/desktop, so the staging script the context prep delegates to
      # is apps/desktop/scripts/stage-harness.mjs.
      - name: Validate image channels
        run: node --test "$CONTEXT/scripts/"*.test.mjs

      - name: Prepare build context
        run: node "$CONTEXT/scripts/prepare-context.mjs" --harness . --app apps/desktop --out "$CONTEXT/build" --strict

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: node "$CONTEXT/scripts/image-tags.mjs" "$CONTEXT/build/meta.json" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          # The recipe is a Containerfile; build-push-action defaults to Dockerfile.
          file: ${{ env.CONTEXT }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # build-push-action does not read the login-action step above: it takes
          # a token through this input and otherwise falls back to whatever
          # credentials the runner happens to carry. Passing it is what turns the
          # workflow's `packages: write` grant into the push, and without it the
          # build succeeds and the push is denied with `write_package`.
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          labels: |
            org.opencontainers.image.title=dsh-sandbox
            org.opencontainers.image.description=Containerized DeepSeek Harness with the fork's plugins pre-installed
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
